[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/admin-invites"
  to = "/.netlify/functions/invite-admin"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
